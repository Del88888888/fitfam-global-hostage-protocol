<!DOCTYPE html><html><head><link rel='stylesheet' href='style.css'></head>
<body>
<h1>Tracking Team</h1>
<div id='mission1'>
<input id='pin1' placeholder='Enter PIN'>
<button onclick='unlock()'>UNLOCK INTEL + MISSION 2</button>
</div>
<div id='intel' class='hidden'>
<h2>INTEL UPDATE</h2>
<p>This intel is being transmitted...</p>
<button onclick="document.getElementById('intel').innerHTML+=' ✅ DONE'">continue</button>
</div>
<script>
function norm(v){return String(v||'').replace(/[^0-9a-zA-Z]/g,'').toLowerCase();}
function unlock(){
  var pin = norm(document.getElementById('pin1').value);
  if(pin==='1886'){
    document.getElementById('mission1').classList.add('hidden');
    document.getElementById('intel').classList.remove('hidden');
  }else{alert('wrong pin')}
}
</script>
</body></html>
